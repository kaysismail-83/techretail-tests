# CI för ditt testrepo (GitHub Actions). Körs vid varje push och pull request.
# Lektion 3: du gör klart de två TODO-stegen så att även GUI-testerna körs i CI.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installera uv och Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true

      - name: Installera paketen
        run: uv sync --locked

      - name: Komponenttester
        run: uv run pytest tests/unit -v

      # Fördjupning (lektion 3, valbart): mät uppskattad energi med Eco CI.
      # Ta bort # framför de tre stegen nedan. send-data: false gör att inga mätdata skickas till tredje part.
